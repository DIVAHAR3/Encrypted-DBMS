{% extends 'base.html' %}
{% block title %}{{ form_title }} · Encrypted DBMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card glass-panel">
            <div class="card-body p-4 p-lg-5">
                <h1 class="section-title mb-4">{{ form_title }}</h1>
                <form method="post" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control form-control-lg" value="{{ customer.name if customer else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control form-control-lg" value="{{ customer.email if customer else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control form-control-lg" value="{{ customer.phone if customer else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <input type="text" name="address" class="form-control form-control-lg" value="{{ customer.address if customer else '' }}" required>
                    </div>
                    <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-3 mt-2">
                        <button class="btn btn-brand btn-lg px-4" type="submit">Save</button>
                        <a class="btn btn-outline-light btn-lg" href="{{ url_for('customers.customers') }}">Back to Customers</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
